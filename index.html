<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADITYA KUMAR</title>
    <style>
        :root {
            --bg-color: #f7d084;
            --main-font-color: #000000;
            --kinetic-pill-color: #ffffff;
            --main-font: 'Inter', system-ui, -apple-system, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: var(--main-font);
            color: var(--main-font-color);
        }

        .name-container {
            display: flex;
            flex-direction: column;
            gap: 2.5vw;
        }

        .name-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.5vw;
        }

        .name-text {
            font-size: clamp(3.5rem, 8vw, 10rem);
            font-weight: 800;
            letter-spacing: -0.04em;
            line-height: 1;
        }

        .pill {
            height: clamp(3.5rem, 8vw, 10rem);
            background-color: var(--kinetic-pill-color);
            border-radius: 9999px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
        }

        .ball {
            position: absolute;
            width: clamp(3.5rem, 8vw, 10rem);
            height: clamp(3.5rem, 8vw, 10rem);
            background-color: #000000;
            border-radius: 50%;
            top: 0;
            left: 0;
        }

        #pill1 {
            width: clamp(9rem, 20vw, 24rem);
        }

        #pill1 .ball {
            animation: fastSwing1 0.75s ease-in-out infinite alternate;
        }

        #pill2 {
            width: clamp(10rem, 22vw, 26rem);
        }

        #pill2 .ball {
            animation: fastSwing2 0.75s ease-in-out infinite alternate;
        }

        @keyframes fastSwing1 {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(calc(clamp(9rem, 20vw, 24rem) - clamp(3.5rem, 8vw, 10rem)));
            }
        }

        @keyframes fastSwing2 {
            0% {
                transform: translateX(calc(clamp(10rem, 22vw, 26rem) - clamp(3.5rem, 8vw, 10rem)));
            }
            100% {
                transform: translateX(0);
            }
        }
    </style>
</head>
<body>

    <main class="name-container">
        <div class="name-row">
            <span class="name-text">AD</span>
            <div id="pill1" class="pill">
                <div class="ball"></div>
            </div>
            <span class="name-text">TYA</span>
        </div>

        <div class="name-row">
            <div id="pill2" class="pill">
                <div class="ball"></div>
            </div>
            <span class="name-text">KUMAR</span>
        </div>
    </main>

</body>
</html>
